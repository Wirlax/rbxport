name: Release

# A tag is the release. `v1.2.3` builds macOS, Windows and Linux, signs the
# first two where the signing secrets exist, and publishes the installers to the R2 bucket as
# `rbxport-1.2.3-<platform>.<ext>` — flat keys, the version in the
# name — plus `latest.json`, so a page can find the newest version without
# a folder listing.
#
# R2 is the only place a release is published. No GitHub Release is created:
# this repository is private and release assets inherit that, so a download
# link would 404 for everyone it was given to, and the workflow token is
# read-only, so creating one would need a permission this file does not ask
# for. The bucket is the download; the tag is the record.
#
# `workflow_dispatch` without release_tag builds a development preview.
# Supplying an existing release_tag rebuilds that source with this workflow
# and publishes it, without moving the source tag.
#
# Every job runs on the `arc` self-hosted fleet (`self-hosted, <os>, <arch>`),
# one host per platform: an Apple Silicon Mac, a Windows desktop and a Linux
# VM. A hosted image preinstalls a toolchain; an arc host is somebody's actual
# machine, so anything a job needs it installs itself in an idempotent
# "Ensure …" step — a no-op on the second run, and the record of what the host
# needs if it is ever rebuilt.
#
# The macOS host being a real person's Mac is why the signing identity is
# imported into a throwaway keychain under RUNNER_TEMP and removed again on the
# way out, rather than being left in a login keychain.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and publish (blank builds a development preview)"
        required: false
        type: string

concurrency:
  group: release-installers
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-macos:
    # Serialize only the Macs: both may share a signing keychain search list.
    # Matrix limits keep the run discoverable by arc (job concurrency marks
    # the whole run pending, which arc does not currently discover).
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - host: [self-hosted, macos, arm64]
            target: aarch64-apple-darwin
            bundles: app,dmg
            slug: darwin-aarch64
          - host: [self-hosted, macos, arm64]
            target: x86_64-apple-darwin
            bundles: app,dmg
            slug: darwin-x86_64
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit
    with:
      host: ${{ toJSON(matrix.host) }}
      target: ${{ matrix.target }}
      bundles: ${{ matrix.bundles }}
      slug: ${{ matrix.slug }}
      source_ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      preview: ${{ github.event_name != 'push' && inputs.release_tag == '' }}

  build-other:
    # Windows and Linux build alongside the serialized Mac jobs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: [self-hosted, windows, x64]
            target: x86_64-pc-windows-msvc
            bundles: nsis
            slug: windows-x86_64
          - host: [self-hosted, linux, x64]
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            slug: linux-x86_64
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit
    with:
      host: ${{ toJSON(matrix.host) }}
      target: ${{ matrix.target }}
      bundles: ${{ matrix.bundles }}
      slug: ${{ matrix.slug }}
      source_ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      preview: ${{ github.event_name != 'push' && inputs.release_tag == '' }}

  publish:
    # Publish tag pushes and explicitly requested rebuilds of existing tags.
    # A manual run without release_tag builds without publishing.
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs: [build-macos, build-other]
    runs-on: [self-hosted, linux, x64]
    steps:
      # For CHANGELOG.md, which rides along in the feed as the release
      # notes: the app shows the sections between the version it is and the
      # version on offer. Nothing else here needs the tree. FIRST, before
      # the installers are downloaded: checkout cleans the workspace, and
      # placed after the download it deleted `out/` — 0.5.1's publish died
      # on `ls: cannot access 'out'` after both builds had passed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: out

      # The steps below build and read latest.json with node. The checkout
      # above puts nothing on PATH, and the arc Linux host's own node is not
      # something a job should depend on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure the AWS CLI
        # A hosted Ubuntu image ships it; the arc Linux host does not. Into
        # ~/.local so no step here needs sudo.
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1 && [ ! -x "$HOME/.local/bin/aws" ]; then
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
            unzip -qo /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install --update -i "$HOME/.local/aws-cli" -b "$HOME/.local/bin"
            rm -rf /tmp/aws /tmp/awscliv2.zip
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish to R2
        # S3-compatible, so the AWS CLI is the whole client. The endpoint is
        # the account's; the bucket is a variable so this file names no account
        # of anyone's.
        #
        # Object keys are FLAT — no `<version>/` or `latest/` prefix, ever. The
        # version is already in every filename, so a folder per version buys
        # nothing and costs a URL nobody can read, type or grep for; one
        # namespace also means a stale prefix cannot shadow a new upload. The
        # build job has already named the files
        # `rbxport-<semver>-<platform>[-setup].<ext>`.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Recent AWS CLI versions attach CRC32 integrity headers that R2
          # rejects with a 400 whose message says nothing useful.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test -n "$BUCKET"
          ls -l out

          # Payloads first, feed second: latest.json must never name a file
          # that has not finished uploading. Immutable caching is safe because
          # a name is never reused — a new version is a new key.
          for f in out/*; do
            aws s3 cp "$f" "s3://$BUCKET/$(basename "$f")" \
              --endpoint-url "$ENDPOINT" --no-progress \
              --cache-control "public, max-age=31536000, immutable"
          done

          # The one fixed path in the bucket, and what replaces the `latest/`
          # folder. Two readers: the app's updater, which wants `platforms`
          # in its own shape — one entry per `{os}-{arch}` it runs as, each
          # a signed URL, and `notes` for what changed — and a person or a
          # page, which wants `downloads`: the installers by the platform
          # names the files carry. They are separate because the updater
          # refuses a `platforms` entry without a signature, and a DMG has
          # none. Each Mac architecture gets its own payload and signature.
          # The updater looks for
          # `{os}-{arch}-{installer}` before `{os}-{arch}`, so on Linux the
          # AppImage sits under the plain key and the .deb, when the
          # bundler signed it, under `linux-x86_64-deb`: an app installed
          # from the package takes the package, one run as an AppImage takes
          # the AppImage.
          test -s CHANGELOG.md
          node -e '
            const fs = require("fs");
            const [, version, base] = process.argv;
            const files = fs.readdirSync("out");
            const url = (file) => (base ? base + "/" + file : undefined);
            const signed = (payload, optional = false) => {
              const file = files.find(payload);
              if (!file) return null;
              const sig = file + ".sig";
              if (!files.includes(sig)) {
                if (optional) return null;
                throw new Error("no updater signature beside " + file);
              }
              return { url: url(file), signature: fs.readFileSync("out/" + sig, "utf8").trim() };
            };
            const macArm = signed((f) => f.endsWith("-darwin-aarch64.app.tar.gz"));
            const macIntel = signed((f) => f.endsWith("-darwin-x86_64.app.tar.gz"));
            if (!macArm || !macIntel) throw new Error("both Mac updater builds are required");
            const win = signed((f) => f.endsWith("-setup.exe"));
            const linux = signed((f) => f.endsWith(".AppImage"));
            const deb = signed((f) => f.endsWith(".deb"), true);
            const platforms = {};
            platforms["darwin-aarch64"] = macArm;
            platforms["darwin-x86_64"] = macIntel;
            if (win) platforms["windows-x86_64"] = win;
            if (linux) platforms["linux-x86_64"] = linux;
            if (deb) platforms["linux-x86_64-deb"] = deb;
            const downloads = {};
            for (const [slug, match] of [
              ["darwin-aarch64", (f) => f.endsWith("-darwin-aarch64.dmg")],
              ["darwin-x86_64", (f) => f.endsWith("-darwin-x86_64.dmg")],
              ["windows-x86_64", (f) => f.endsWith("-setup.exe")],
              ["linux-x86_64", (f) => f.endsWith(".AppImage")],
              ["linux-x86_64-deb", (f) => f.endsWith(".deb")],
            ]) {
              const file = files.find(match);
              if (file) downloads[slug] = { file, url: url(file) };
            }
            const feed = {
              version,
              pub_date: new Date().toISOString(),
              notes: fs.readFileSync("CHANGELOG.md", "utf8"),
              platforms,
              downloads,
            };
            fs.writeFileSync("latest.json", JSON.stringify(feed, null, 2) + "\n");
            const { notes, ...shown } = feed;
            console.log(JSON.stringify({ ...shown, notes: notes.length + " bytes" }, null, 2));
          ' "$version" "${CDN_BASE_URL:-}"

          # Short TTL: this is the file anything checking for a new version
          # reads, and a long one delays the rollout by exactly that much.
          aws s3 cp latest.json "s3://$BUCKET/latest.json" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type application/json --cache-control "public, max-age=60"

      - name: Re-fetch what was just published
        # The same request a download page makes, so a bucket that uploaded
        # fine but serves nothing fails the release instead of being found by
        # the first person who clicks a link. Only possible once the bucket has
        # a public base URL; without one there is nothing to fetch.
        if: vars.CDN_BASE_URL != ''
        env:
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # A few retries: a freshly written object is readable at once, but a
          # public domain enabled minutes ago answered 401 for its first ten
          # seconds, and that is a wait, not a failure.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "$CDN_BASE_URL/latest.json" -o published.json
          cat published.json
          test "$(node -p 'require("./published.json").version')" = "$version"
          for url in $(node -p '
            const feed = require("./published.json");
            [...Object.values(feed.platforms), ...Object.values(feed.downloads)].map((p) => p.url).join("\n")
          '); do
            curl -fsI --retry 5 --retry-all-errors --retry-delay 5 "$url" > /dev/null
          done
