name: Validate

# This workflow never receives deployment secrets and never runs packaging or
# publication. The callable release workflow owns the validation jobs so CI
# and a release cannot accidentally diverge.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA or ref to validate (blank uses the selected ref)"
        required: false
        type: string

permissions:
  # The reusable release workflow declares contents: write for a real release.
  # A caller cannot grant a reusable workflow more than its own token, even
  # when the validation-only path never writes. Keep the upper bound here so
  # GitHub can initialize that workflow; fork PRs remain excluded below.
  contents: write

jobs:
  autofix:
    name: Apply safe merge fixes
    # A fork's token is read-only and must never be used to modify its branch.
    # Same-repository PRs get deterministic Clippy rewrites and English locale
    # fallbacks, then this run validates the resulting exact SHA.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    outputs:
      source_ref: ${{ steps.commit.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install the Linux build dependencies
        run: |
          sudo flock /var/lock/rbxport-ci-apt.lock bash -c '\
            apt-get update && \
            apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
              librsvg2-dev patchelf libgtk-3-dev libasound2-dev'

      - name: Ensure rustup
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Give cargo a home of its own
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy

      - name: Apply Clippy's machine-applicable fixes
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Add missing locale fallbacks
        run: node scripts/fill-missing-locales.mjs

      - id: commit
        name: Commit applied fixes
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates public/locales
          git commit -m "chore: apply merge fixes" \
            -m "Apply Clippy rewrites and locale fallbacks before validation."
          git push origin "HEAD:$PR_HEAD_REF"
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    # GITHUB_TOKEN pushes do not start another workflow run. Validate the SHA
    # written by autofix here, and never execute untrusted fork code on ARC.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: autofix
    uses: ./.github/workflows/release.yml
    with:
      source_ref: ${{ needs.autofix.outputs.source_ref || inputs.source_ref || github.sha }}
      validate_only: true
