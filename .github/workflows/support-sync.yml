name: Sync support status

on:
  issues:
    types: [opened, edited, assigned, unassigned, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [closed]
  push:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: rbx-support-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          sparse-checkout: |
            scripts/support-sync.mjs
            scripts/support-status.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ticket labels and Discord forum tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RBX_DISCORD_BOT_TOKEN: ${{ secrets.RBX_DISCORD_BOT_TOKEN }}
        run: node scripts/support-sync.mjs
