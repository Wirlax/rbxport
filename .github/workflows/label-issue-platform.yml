name: Label issue platform

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  platform:
    name: Apply operating-system label
    runs-on: ubuntu-latest
    steps:
      - name: Match the issue form operating system
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const match = body.match(
              /(?:^|\r?\n)### Operating system\r?\n+\s*([^\r\n]+)\s*(?:\r?\n|$)/,
            );

            // Blank issues and other templates do not have this field.
            if (!match) return;

            const platforms = {
              macOS: {
                name: "macos",
                color: "000000",
                description: "Bug reported on macOS",
              },
              Windows: {
                name: "windows",
                color: "0078D4",
                description: "Bug reported on Windows",
              },
              Linux: {
                name: "linux",
                color: "FCC624",
                description: "Bug reported on Linux",
              },
            };
            const selected = platforms[match[1].trim()];
            const platformNames = Object.values(platforms).map(({ name }) => name);
            const currentNames = context.payload.issue.labels.map((label) =>
              typeof label === "string" ? label : label.name,
            );

            for (const name of platformNames) {
              if (name !== selected?.name && currentNames.includes(name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
              }
            }

            // "Other" deliberately has no platform label.
            if (!selected || currentNames.includes(selected.name)) return;

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: selected.name,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ...selected,
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [selected.name],
            });
