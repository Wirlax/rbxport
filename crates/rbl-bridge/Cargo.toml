[package]
name = "rbl-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "This fork's own: a read-only HTTP bridge that serves the rekordbox library and its audio to the Tempo app."

[lints]
workspace = true

[[bin]]
name = "tempo-bridge"
path = "src/main.rs"

[dependencies]
rbl-anlz = { path = "../rbl-anlz" }
rbl-core = { path = "../rbl-core" }
rbl-db = { path = "../rbl-db" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
