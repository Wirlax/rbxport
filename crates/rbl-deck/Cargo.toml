[package]
name = "rbl-deck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The playback engine: decks, the audio device, and the clock the interface reads."

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
cpal = "0.18"
rtrb = "0.4"
rubato = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "flac", "wav", "aiff", "pcm", "adpcm"] }

[dev-dependencies]
tempfile = "3"
# The load probe walks the installed library; the engine itself needs neither.
rbl-db = { path = "../rbl-db" }
rbl-index = { path = "../rbl-index" }
