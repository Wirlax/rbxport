[package]
name = "rekordbox-lite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rekordbox-compatible export-mode library manager."

[lib]
name = "rekordbox_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rbl-core = { path = "../crates/rbl-core" }
rbl-db = { path = "../crates/rbl-db" }
rbl-index = { path = "../crates/rbl-index" }
rbl-anlz = { path = "../crates/rbl-anlz" }
rbl-analysis = { path = "../crates/rbl-analysis" }
rbl-audio = { path = "../crates/rbl-audio" }
parking_lot = "0.12"
