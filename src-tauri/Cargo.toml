[package]
name = "rbxport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rekordbox-compatible export-mode library manager."

[lib]
name = "rbxport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Remembers the window's size, position and maximised state across runs.
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The daily log file (`logging.rs`), written off the calling thread.
tracing-appender = "0.2"
rbl-core = { path = "../crates/rbl-core" }
rbl-db = { path = "../crates/rbl-db" }
rbl-index = { path = "../crates/rbl-index" }
rbl-anlz = { path = "../crates/rbl-anlz" }
rbl-analysis = { path = "../crates/rbl-analysis" }
rbl-audio = { path = "../crates/rbl-audio" }
rbl-deck = { path = "../crates/rbl-deck" }
rbl-prolink = { path = "../crates/rbl-prolink" }
rbl-link = { path = "../crates/rbl-link" }
rbl-export = { path = "../crates/rbl-export" }
rbl-devices = { path = "../crates/rbl-devices" }
rbl-pdb = { path = "../crates/rbl-pdb" }
rbl-onelibrary = { path = "../crates/rbl-onelibrary" }
# The diagnostics readout in the title bar: this process's CPU and memory.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
parking_lot = "0.12"
dirs = "5"
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
semver = "1"
time = { version = "0.3", features = ["formatting"] }

zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
# `test` gives a mock app, so the native menu can be built and inspected
# without opening a window — which cannot be screenshotted on this machine.
tauri = { version = "2", features = ["test"] }

# macOS builds menu items on the main thread only, and the test harness runs
# every test on a spawned one. Without a harness, `main` is the main thread.
[[test]]
name = "menu"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
drag = "2.1.1"
libc = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
